<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML - Trabalhando com Formulários</title>
</head>
<body>
     
    <h4>Envie uma mensagem preenchendo o <br />formulário abaixo</h4>
    <form action="" method="">
        Seu Nome<br />
        <input type="text" name="nome" placeholder="Meu nome e Sobrenome"/><br /><br />

        Seu Telefone<br />
        <input type="text" name="fone" placeholder="9999999999"/><br /><br />

        Seu E-Mail<br />
        <input type="text" name="mail" placeholder="meuemail@exemplo.com.br"/><br /><br />

        Deseja receber nossas novidades?<br />
        <input type="radio" name="novidades" />Sim
        <input type="radio" name="novidades" />Não<br /><br />

        Aonde nos encontrou:<br />
        Exemplo de Checkbox<br />
        <input type="checkbox" name="opc1" />E-mail
        <input type="checkbox" name="opc2" />Google
        <input type="checkbox" name="opc3" />Youtube<br /><br />

        Selecione uma Opção na lista:<br />
        <select>
            <option>Selecione uma opção</option>
            <option value="Brasil">Brasil - BR</option>
            <option value="Argentina">Brasil - AG</option>
            <option value="Chile">Chile - CH</option>
        </select>
        <br /><br />

        Sua mensagem<br />
        <textarea name="opiniao" rows="5" placeholder="Minha mensagem de exemplo!"></textarea><br /><br />
        <input type="submit" value="Enviar" />
    </form>
</body>
</html>
