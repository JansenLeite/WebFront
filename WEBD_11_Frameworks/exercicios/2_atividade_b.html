<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Formulário de Contato - Atividade 2 - b</title>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h3 class="mb-4">Fale Conosco</h3>
        <form>
            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Nome</label>
                    <input text="text" class="form-control" />
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">E-mail</label>
                    <input text="email" class="form-control" />
                </div>

                <div class="col-md-12 mb-3">
                    <label class="form-label">Assunto</label>
                    <input text="text" class="form-control" />
                </div>

                <div class="col-md-12 mb-3">
                    <label class="form-label">Mensagem</label>
                    <textarea class="form-control"></textarea>
                </div>

                <div class="col-md-12 mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox">
                        <label class="form-check-label">
                            Aceito receber novidades.
                        </label>
                    </div>
                </div>

                <div class="col-md-12">
                    <button type="button" class="btn btn-success float-end">Enviar</button>
                </div>

            </div>
        </form>
    </div>
</body>
</html>
