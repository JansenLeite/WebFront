<!DOCTYPE html>
<html lang="en">
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Centralizando GRID Horizontamente e Verticalmente.</title>
</head>
<body class="bg-light">

            CLASSES BOOTSTRAP          PARÂMETROS DO CSS 
            d-flex                  -> display: flex; (no CSS)
            justify-content-center  -> justify-content: center; (no CSS)
            align-items-center      -> align-items: center; (no CSS)
            vh-100                  -> min-height: 100vh; (no CSS)
    -->
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card">
            <h3>Centralizando o CARD Verticalmente e Horizontamente</h3>
        </div>
    </div>
</body>
