<!DOCTYPE html>

<head>

     <style type="text/css">@import url("css/03_exemplo_02.css");</style>
    <title>Exemplo 02 - Tabela</title>

<body>
    <h3>Classificação de Child-Pugh</h3>
    <table>
        <tr class="cab1">
            <td>Critérios</td>
            <td>1 ponto</td>
            <td>2 pontos</td>
            <td>3 pontos</td>
        </tr>
        <tr>
            <td>Encefalopatia</td>
            <td>Ausente</td>
            <td>Graus I e II</td>
            <td>Graus III e IV</td>
        </tr>
        <tr>
            <td>Ascite</td>
            <td>Ausente</td>
            <td>Pequena</td>
            <td>Volumosa</td>
        </tr>
        <tr>
            <td>INR (RNI)</td>
            <td>< 1,7</td>
            <td>1,7 - 2,3</td>
            <td>> 2,3</td>
        </tr>
        <tr>
            <td>Bilirrubina total</td>
            <td>< 2</td>
            <td>2 - 3</td>
            <td>> 3</td>
        </tr>
        <tr>
            <td>Albumina</td>
            <td>> 3,5</td>
            <td>2,8 - 3,5</td>
            <td>> 2,8</td>
        </tr>
    </table>
</body>
