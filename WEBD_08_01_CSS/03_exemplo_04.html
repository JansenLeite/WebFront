<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Importando o CSS -->
     <style type="text/css">@import url("css/03_exemplo_04.css");</style>
    <title>Exemplo 03 - Login</title>
</head>
<body>
    <!-- Estrutura DIV -  Utilizada para criar divisões (caixas) separar estruturas HTML em Blocos -->
    <div>
        <form action="" method="">
            
            <h6>Contact Form</h6>
            <p>Please fill your information and well'be sending yourorder in no time.</p>

            <div class="box">
                <div class="box_name">
                    <span class="subtit">Your Name</span>
                </div>
                 <div class="box_input">
                    <input type="text" name="nome" placeholder="First Name" class="inpname1"/>
                    <input type="text" name="sobrenome" placeholder="Last Name" class="inpname2"/>
                </div>
            </div>

            <div class="box">
                <div class="box_name">
                    <span class="subtit">Your Email</span>
                </div>
                 <div class="box_input">
                    <input type="text" name="email" placeholder="" class="inpmail"/>
                </div>
            </div>

        </form>

            <p class="conta">Ainda não tem conta? <a href="" target="">Cadastre-se</a></p>

    </div>
    
</body>
</html>
