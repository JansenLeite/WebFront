<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Importando o CSS -->
     <style type="text/css">@import url("css/03_exemplo_03.css");</style>
    <title>Exemplo 03 - Login</title>
</head>
<body>
    <!-- Estrutura DIV -  Utilizada para criar divisões (caixas) separar estruturas HTML em Blocos -->
    <div>
        <form action="" method="">
            
            <h6>Login</h6>

            <div class="linha"></div>

            <p class="subtit">Seu e-mail</p>
            <input type="text" name="email" placeholder="contato@seudominio.com.br" class="inp"/>

            <p class="subtit">Sua senha</p>
            <input type="text" name="senha" placeholder="1234" class="inp" />

            <input type="checkbox" name="lembrar" class="chk" />
            <span>Manter-me logado</span>

            <input type="submit" value="Logar" class="bt_enviar"/>

        </form>

            <p class="conta">Ainda não tem conta? <a href="" target="">Cadastre-se</a></p>

    </div>
    
</body>
</html>
